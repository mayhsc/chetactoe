<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chetactoe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h1>CHETACTOE</h1>

      <div id="screen-menu" class="screen">
        <p class="prompt">Choose a game mode</p>
        <div class="menu-options">
          <button data-mode="local">Local (pass &amp; play)</button>
          <button data-mode="bot">Vs Bot</button>
          <button data-mode="network">Network</button>
        </div>
      </div>

      <div id="screen-side" class="screen hidden">
        <p class="prompt">Choose your side</p>
        <div class="menu-options">
          <button data-side="white">White</button>
          <button data-side="black">Black</button>
        </div>
        <button id="side-back" class="back-btn">Back</button>
      </div>

      <div id="screen-network" class="screen hidden">
        <p class="prompt">Network mode coming soon.</p>
        <div class="menu-options">
          <button id="network-create">Create Game</button>
          <button id="network-join">Join Game</button>
        </div>
        <button id="network-back" class="back-btn">Back</button>
      </div>

      <div id="screen-game" class="screen hidden">
        <div id="status"></div>
        <div id="hand-black" class="hand"></div>
        <div id="board"></div>
        <div id="hand-white" class="hand"></div>
      </div>

      <div id="screen-room" class="screen hidden">
        <p class="prompt">Your Room Code:</p>
        <h2 id="room-code-display"></h2>
        <p id="host-status" class="prompt room-subtext">
          Waiting for peer to join...
        </p>
        <button id="room-back" class="back-btn">Back</button>
      </div>

      <div id="screen-join" class="screen hidden">
        <p class="prompt">Enter Room Code</p>
        <div class="input-group">
          <input
            type="text"
            id="join-code-input"
            maxlength="5"
            placeholder="ABCDE"
          />
          <button id="join-submit">Join</button>
        </div>
        <p id="join-error"></p>
        <button id="join-back" class="back-btn">Back</button>
      </div>

      <div id="screen-join" class="screen hidden">
        <p class="prompt">Enter Room Code</p>
        <div class="input-group">
          <input
            type="text"
            id="join-code-input"
            maxlength="5"
            placeholder="ABCDE"
          />
          <button id="join-submit">Join</button>
        </div>
        <p id="peer-status" class="prompt room-subtext"></p>
        <p id="join-error"></p>
        <button id="join-back" class="back-btn">Back</button>
      </div>

      <div id="screen-peer-wait" class="screen hidden">
        <p class="prompt">Joined Room!</p>
        <div class="status-box">
          <p class="room-subtext">Waiting for host to initiate connection...</p>
        </div>
        <button id="peer-wait-back" class="back-btn">Cancel</button>
      </div>
    </div>
    <script src="wasm_exec.js"></script>
    <script src="app.js"></script>
    <script>
      ;(function () {
        const watched = ["app.js", "style.css", "bin/chetactoe.wasm"]
        let lastModifiedMap = {}

        setInterval(async () => {
          for (const file of watched) {
            try {
              const response = await fetch(file, {
                method: "HEAD",
                cache: "no-cache",
              })
              const current = response.headers.get("Last-Modified")
              if (lastModifiedMap[file] && lastModifiedMap[file] !== current) {
                window.location.reload()
                return
              }
              lastModifiedMap[file] = current
            } catch (e) {}
          }
        }, 1000)
      })()
    </script>
  </body>
</html>
